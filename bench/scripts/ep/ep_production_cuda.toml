# Production-scale EP search on CUDA: the CLI twin of ep_production_cuda.py.
#
# Simulate the pulse first (same parameters and seed as the script):
#   loki simulate --period 0.007 --dt 0.000064 --nsamps 33554432 --snr 12 \
#       --ducy 0.1 --acc 300 --jerk 0.15 --seed 42 -o ep_production_pulse.tim
# Then run from the repository root:
#   loki search ep -c bench/scripts/ep/ep_production_cuda.toml
#
# The script and this file share the plan cache, so a plan made by either one
# is reused by the other.

[input]
timeseries = "ep_production_pulse.tim"
nsamps = 33554432
tsamp = 0.000064

[search]
# Band in Hz around the injected 142.857 Hz (period 0.007 s): intrinsic spin
# frequencies, widened by v/c from [search.orbit]
f_min = 140.0
f_max = 145.0
nbins = 64
eta = 1.0
ducy_max = 0.3
wtsp = 1.2
snr_min = 5.0
use_fourier = true

# Acceleration and jerk limits of circular orbits with P_orb >= 5 T_obs (a
# coherent jerk search), m_c <= 10 and m_p >= 1.2 M_sun: about +/- 499 m/s^2
# and +/- 0.29 m/s^3 at 2^25 samples. The injected pulse (acc 300, jerk 0.15)
# is such an orbit (P_orb = 5.9 T_obs).
[search.orbit]
order = "jerk"
p_orb_min_tobs = 5.0
m_c_max = 10.0
m_p_min = 1.2

[ep]
poly_basis = "taylor"
min_pd = 0.1
ref_ducy = 0.1
prune_poly_order = 3
n_runs = 16

[performance]
nthreads = 1
backend = "cuda"
device = 0
# Device memory cap in GB. The plan is fitted to the smaller of this and the
# free device memory less 1 GB.
max_process_memory_gb = 15.0
bseg_brute = 4096
bseg_ffa = 262144

[output]
outdir = "pruning_results/ep_production_cuda"
prefix = "ep_production"
plan_cache = "pruning_results/ep_production_cuda/ep_production_ep_plan.h5"
