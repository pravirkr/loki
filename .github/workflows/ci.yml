name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6

jobs:
  cpp:
    name: C++ (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            apt_profile: cpp-gcc13
            ccache_prefix: ci-gcc13
          - compiler: clang++-18
            apt_profile: cpp-clang18
            ccache_prefix: ci-clang18

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/install-loki-deps
        with:
          profile: ${{ matrix.apt_profile }}

      - uses: ./.github/actions/cache-ccache
        with:
          prefix: ${{ matrix.ccache_prefix }}

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/LokiDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure, build, and test (CMake preset ci)
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true
          cmake --version
          cmake --preset ci -D CMAKE_CXX_COMPILER="${{ matrix.compiler }}"
          cmake --build --preset ci --parallel "$(nproc)"
          ctest --preset ci
          ccache --show-stats || true

      # Installed package must work for downstream find_package(loki) users.
      - name: Install and build a downstream consumer
        run: |
          cmake --install build-ci --prefix "$RUNNER_TEMP/loki"
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loki"
          cmake --build build-consumer
          ./build-consumer/loki_consumer

  cpp-sanitizer:
    name: C++ ASan/UBSan (g++-14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/install-loki-deps
        with:
          profile: asan-gcc14

      - uses: ./.github/actions/cache-ccache
        with:
          prefix: asan-gcc14

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/LokiDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure, build, and test (CMake preset asan)
        run: |
          ccache --zero-stats || true
          cmake --preset asan -D CMAKE_CXX_COMPILER=g++-14
          cmake --build --preset asan --parallel "$(nproc)"
          ctest --preset asan
          ccache --show-stats || true

  # Lint job gate: job-level `if` cannot use workflow `env`. Re-enable → true.
  clang-tidy:
    if: ${{ false }}
    name: Lint & static analysis (LLVM 23)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_VERSION: "23"
      BUILD_DIR: build-ci-tidy
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/install-loki-deps
        with:
          profile: lint-base
          llvm-version: "23"

      - uses: ./.github/actions/cache-ccache
        with:
          prefix: ci-tidy-clang23

      # PyPI pre-commit CLI (not pre-commit-hooks rev in .pre-commit-config.yaml).
      - name: Install pre-commit
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages \
            pre-commit==4.6.2

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/LokiDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Warm pre-commit hook environments
        run: pre-commit install-hooks

      - name: Configure (CMake preset ci-tidy)
        run: |
          cmake --preset ci-tidy \
            -D CMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}"

      - name: Build and static analysis (parallel prebuild + aggregate report)
        run: scripts/ci_lint_job.sh

  python:
    name: Python (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/install-loki-deps
        with:
          profile: python

      - uses: ./.github/actions/cache-ccache
        with:
          prefix: python-scikit

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/LokiDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # Wall time is mostly uv sync (pyloki git dep), extension compile, and tests.
      - name: Install package and test dependencies
        run: uv sync --extra tests
        env:
          CMAKE_ARGS: >-
            -DLOKI_CUDA=OFF
            -DLOKI_BUILD_TESTING=OFF
            -DLOKI_ENABLE_NATIVE_ARCH=OFF

      - name: Run Python tests
        run: uv run pytest tests/python
