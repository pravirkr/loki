name: Install Loki system dependencies
description: Cached apt packages for Loki CI jobs

inputs:
  profile:
    description: >
      Package profile: cpp-gcc13, cpp-clang18, asan-gcc14, python, lint-base
    required: true
  apt-cache-version:
    description: Bump when the apt package set for a profile changes
    required: false
    default: "1"
  llvm-version:
    description: If non-empty, install Clang/LLVM tools from apt.llvm.org
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache and install apt packages (cpp-gcc13)
      if: inputs.profile == 'cpp-gcc13'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: cmake ninja-build libhdf5-dev libfftw3-dev libomp-dev ccache gcc-13 g++-13
        version: cpp-gcc13-${{ inputs.apt-cache-version }}

    - name: Cache and install apt packages (cpp-clang18)
      if: inputs.profile == 'cpp-clang18'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: cmake ninja-build libhdf5-dev libfftw3-dev libomp-dev ccache clang-18
        version: cpp-clang18-${{ inputs.apt-cache-version }}

    - name: Cache and install apt packages (asan-gcc14)
      if: inputs.profile == 'asan-gcc14'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: cmake ninja-build libhdf5-dev libfftw3-dev libomp-dev ccache gcc-14 g++-14
        version: asan-gcc14-${{ inputs.apt-cache-version }}

    - name: Cache and install apt packages (python)
      if: inputs.profile == 'python'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: cmake ninja-build libhdf5-dev libfftw3-dev libomp-dev ccache build-essential git
        version: python-${{ inputs.apt-cache-version }}

    - name: Cache and install apt packages (lint-base)
      if: inputs.profile == 'lint-base'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: cmake ninja-build libhdf5-dev libfftw3-dev libomp-dev ccache python3-dev python3-pip wget lsb-release gnupg software-properties-common
        version: lint-base-${{ inputs.apt-cache-version }}

    - name: Install LLVM from apt.llvm.org
      if: inputs.llvm-version != ''
      shell: bash
      run: |
        set -euo pipefail
        llvm_version="${{ inputs.llvm-version }}"
        wget -qO llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh "$llvm_version"
        sudo apt install -y --no-install-recommends \
          "clang-${llvm_version}" \
          "clang-tidy-${llvm_version}" \
          "clang-format-${llvm_version}" \
          "libomp-${llvm_version}-dev"
        "clang-tidy-${llvm_version}" --version
