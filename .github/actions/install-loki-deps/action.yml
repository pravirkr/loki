name: Install Loki system dependencies
description: Shared apt packages for Loki CI jobs

inputs:
  gcc-13:
    description: Install gcc-13 and g++-13
    required: false
    default: "false"
  clang-18:
    description: Install clang-18
    required: false
    default: "false"
  gcc-14:
    description: Install gcc-14 and g++-14
    required: false
    default: "false"
  build-essential:
    description: Install build-essential (default gcc driver)
    required: false
    default: "false"
  git:
    description: Install git
    required: false
    default: "false"
  python-dev:
    description: Install python3-dev
    required: false
    default: "false"
  llvm-version:
    description: If non-empty, install Clang/LLVM tools from apt.llvm.org
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install base and optional apt packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt update
        packages=(
          cmake
          ninja-build
          libhdf5-dev
          libfftw3-dev
          libomp-dev
          ccache
        )
        if [[ "${{ inputs.gcc-13 }}" == "true" ]]; then
          packages+=(gcc-13 g++-13)
        fi
        if [[ "${{ inputs.clang-18 }}" == "true" ]]; then
          packages+=(clang-18)
        fi
        if [[ "${{ inputs.gcc-14 }}" == "true" ]]; then
          packages+=(gcc-14 g++-14)
        fi
        if [[ "${{ inputs.build-essential }}" == "true" ]]; then
          packages+=(build-essential)
        fi
        if [[ "${{ inputs.git }}" == "true" ]]; then
          packages+=(git)
        fi
        if [[ "${{ inputs.python-dev }}" == "true" ]]; then
          packages+=(python3-dev python3-pip)
        fi
        sudo apt install -y --no-install-recommends "${packages[@]}"

    - name: Install LLVM from apt.llvm.org
      if: inputs.llvm-version != ''
      shell: bash
      run: |
        set -euo pipefail
        llvm_version="${{ inputs.llvm-version }}"
        sudo apt install -y --no-install-recommends \
          wget lsb-release gnupg software-properties-common
        wget -qO llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh "$llvm_version"
        sudo apt install -y --no-install-recommends \
          "clang-${llvm_version}" \
          "clang-tidy-${llvm_version}" \
          "clang-format-${llvm_version}" \
          "libomp-${llvm_version}-dev"
        "clang-tidy-${llvm_version}" --version
