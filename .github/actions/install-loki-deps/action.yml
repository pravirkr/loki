name: Install Loki system dependencies
description: Cached apt packages for Loki CI jobs

inputs:
  profile:
    description: >
      Package profile: cpp-gcc13, cpp-clang18, asan-gcc14, python, lint-base
    required: true
  apt-cache-version:
    description: Bump when the apt package set for a profile changes
    required: false
    default: "4"
  llvm-version:
    description: If non-empty, install Clang/LLVM tools from apt.llvm.org
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Catch2 is not installed here: noble's catch2 (3.4.0) makes CTest fail on runtime SKIP().
    # Tests use CPM Catch2 3.16 via tests/cpp/CMakeLists.txt.
    - name: Select apt packages
      id: select
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        case "${PROFILE}" in
          cpp-gcc13) packages="cmake ninja-build libhdf5-dev libomp-dev ccache gcc-13 g++-13" ;;
          cpp-clang18) packages="cmake ninja-build libhdf5-dev libomp-dev ccache clang-18" ;;
          asan-gcc14) packages="cmake ninja-build libhdf5-dev libomp-dev ccache gcc-14 g++-14" ;;
          python) packages="cmake ninja-build libhdf5-dev libomp-dev ccache build-essential git" ;;
          lint-base) packages="cmake ninja-build libhdf5-dev libomp-dev ccache pybind11-dev python3-dev python3-pip wget lsb-release gnupg software-properties-common" ;;
          *) echo "::error::Unknown profile '${PROFILE}'"; exit 1 ;;
        esac
        echo "packages=${packages}" >> "$GITHUB_OUTPUT"

    - name: Cache and install apt packages
      id: apt
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: ${{ steps.select.outputs.packages }}
        version: ${{ inputs.profile }}-${{ inputs.apt-cache-version }}

    # The action caches whatever apt installed, without checking apt's exit
    # status: a failed fetch (a mirror 404) saves an empty cache, which every
    # later run restores. Its list of cached packages is then empty.
    - name: Install apt packages directly (empty apt cache)
      if: steps.apt.outputs.all-package-version-list == ''
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PACKAGES: ${{ steps.select.outputs.packages }}
      run: |
        echo "::warning::The apt cache for '${PROFILE}' holds no packages; installing them directly. Delete that cache-apt-pkgs entry or bump apt-cache-version."
        read -ra apt_packages <<< "${PACKAGES}"
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes "${apt_packages[@]}"

    - name: Install LLVM from apt.llvm.org
      if: inputs.llvm-version != ''
      shell: bash
      run: |
        set -euo pipefail
        llvm_version="${{ inputs.llvm-version }}"
        wget -qO llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh "$llvm_version"
        sudo apt install -y --no-install-recommends \
          "clang-${llvm_version}" \
          "clang-tidy-${llvm_version}" \
          "clang-format-${llvm_version}" \
          "libomp-${llvm_version}-dev"
        "clang-tidy-${llvm_version}" --version
